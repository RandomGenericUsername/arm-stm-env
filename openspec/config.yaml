schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Greenfield universal MCU dev-env (STM32 first as reference pack): device-agnostic core + device packs + user config overlay (memory/linker/SVD/probe). Dual-mode CLI: (a) containerized interactive dev env, (b) host-transparent compile/build/flash with zero host deps. Old repos ../ArmDevelopmentEnvironment and ../rust-embedded-environment are lessons only, never copy blindly. Repo contract in AGENTS.md (CLAUDE.md symlinks there) applies to all artifacts.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - "Every claim carries Evidence (file path + lines, commit SHA, URL + quote, or prototype command + observed output) and a one-command Verify step; mark Evidence MISSING rather than stating unproven claims as fact."
    - "Always state what is out of scope."
  specs:
    - "Each requirement states its acceptance check (command to run + expected result)."
    - "Cite the source of each requirement (prior-art path, user statement, or prototype output)."
  design:
    - "Include a verification plan - what prototype or test validates each key decision, with exact commands."
    - "No component without an evidence-backed reason to exist."
  tasks:
    - "Each task ends with an observable check (command + expected output); break tasks into chunks of max 2 hours."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
