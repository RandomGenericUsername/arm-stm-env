# STM32F411RE device pack (req-004 group 2.1).
# Values: spike-001-corrected (NOT sibling-copied). Single Cortex-M4.
id: stm32f411re
version: "1.0.0"
family: stm32f4
stacks:
  c: make-cmsis
  cpp: make-cmsis
  rust: cargo-cortex
cores:
  - name: M4
    arch: thumbv7em-none-eabihf
memory:
  - name: flash
    origin_hex: "0x8000000"
    size: 524288 # 512K
  - name: ram
    origin_hex: "0x20000000"
    size: 131072 # 128K
probe:
  transport: stlink
  address: openocd:stlink
# Readback-first ladder: single readback rung proves flash readback.
probe_backend: openocd
proof_rung: readback
blocks:
  openocd:
    interface: stlink.cfg
    board: st_nucleo_f4.cfg
  # Sibling evidence ArmDevelopmentEnvironment@19a3889:
  # setup/create_project/stm_mcu_families.sh:18 FPU_V_PER_PROCESSOR["m4"]=fpv4-sp-d16 (hard).
  fpu:
    mode: hard
    variant: fpv4-sp-d16
  # Sibling evidence: setup/create_project/get_stm32f411xe_resources.sh:3
  # LINKER_SCRIPT_URL=.../STM32F411RETx_FLASH.ld (ST CubeF4 template).
  linker:
    M4: STM32F411RETx_FLASH.ld
  # Placeholder-until-template-story: plausible HAL header default; real
  # defaults source + override precedence wired at template level (spike-004:
  # project-file-wins, pack default fills the rest).
  # Startup filenames verified against pinned submodules (ls), 2026-10-13.
  # Vendor system file (SystemInit) per core; verified against pinned
  # submodules (ls), 2026-10-13. H755 uses the dual-core boot file;
  # runtime boot semantics stay OPEN for HW smoke.
  system:
    M4: system_stm32f4xx.c
  # Device selection macros, verified against the pinned submodule
  # family headers, 2026-10-13.
  defines:
    M4: STM32F411xE
  startup:
    M4: startup_stm32f411xe.s
  config_headers:
    library: stm32hal
    header: stm32_config.h
    defaults_source: pack/defaults.h
  # probe-rs registry names verified against the pinned tool
  # (`probe-rs chip list` in lang-rust:1.99.0), 2026-10-13.
  probe_settings:
    probe-rs:
      chip: STM32F411RE
  # On-board user LED LD2 = PA5, active HIGH (req-014 example). ST UM1724
  # (Nucleo-64 MB1136): "User LD2 ... PA5 ... when the I/O is HIGH value, the
  # LED is on". F4 clocks GPIOs on AHB1ENR: GPIOA @0x40020000, RCC_AHB1ENR
  # @0x40023830, GPIOAEN bit 0. Default core clock HSI = 16 MHz.
  example:
    led:
      port: A
      pin: 5
      active: high
      gpio_base: 0x40020000
      rcc_en_addr: 0x40023830
      rcc_en_bit: 0
      clock_hz: 16000000
  # Cortex-Debug register view (req-017): pinned SVD per core. Source
  # modm-io/cmsis-svd-stm32 (Apache-2.0), fetched at create --vscode.
  svd:
    M4: stm32f4/STM32F411.svd
