id: stm32wl55jc
version: "1.0.0"
cores:
  - name: M4
    arch: thumbv7em-none-eabihf
  - name: M0+
    arch: thumbv6m-none-eabi
memory:
  - name: flash
    origin_hex: "0x08000000"
    size: 1048576
  - name: ram
    origin_hex: "0x20000000"
    size: 65536
probe:
  transport: stlink
  address: openocd:stlink
proof_rung: rung-1
blocks:
  openocd:
    interface: stlink.cfg
    target: stm32wlx.cfg
    dual_core: true
