[project]
name = "arm-stm-env-engine"
version = "0.1.0"
description = "Certified device-model core for arm-stm-env (req-003)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
stm = "engine.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["engine/core/tests", "engine/cli/tests", "engine/adapters/tests", "engine/templates/tests", "engine/verify/tests"]
